
name: Python Calculator CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # JOB 1: BUILD
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Python application
        run: python -m compileall -q calculator.py test_calculator.py


  # JOB 2: TEST
  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest


  # JOB 3: DEPLOY
  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Simulated deployment
        run: echo "Calculator deployment successful!"
